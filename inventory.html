<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Tally</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="letterhead">
    <h1>Inventory Management</h1>
    <p>Godown-wise inventory control</p>
  </div>

  <nav class="nav">
    <a href="index.html">Dashboard</a>
    <a href="entry.html">Add Entry</a>
    <a href="ledger.html">Ledger</a>
    <a href="balances.html">Balances</a>
    <a href="inventory.html" class="active">Inventory</a>
  </nav>

  <div class="container">
    <section class="section">
      <h2 class="section-title">Add Inventory Transaction</h2>
      <form id="inventory-form" class="form-slip">
        <div class="form-row">
          <div class="form-field">
            <label for="item">Item Name</label>
            <input type="text" id="item" name="item" required placeholder="e.g., Cement, Steel, Wood">
          </div>
          <div class="form-field">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" required min="1" step="0.01" placeholder="e.g., 50">
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="godown">Godown/Location</label>
            <input type="text" id="godown" name="godown" required placeholder="e.g., Main Godown, Site A">
          </div>
          <div class="form-field">
            <label for="person">Person</label>
            <input type="text" id="person" name="person" required placeholder="e.g., John Doe">
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="action">Action</label>
            <select id="action" name="action" required>
              <option value="">Select action...</option>
              <option value="given">Given to person</option>
              <option value="received">Received from person</option>
              <option value="removed">Removed from godown</option>
            </select>
          </div>
          <div class="form-field">
            <label for="note">Note (optional)</label>
            <input type="text" id="note" name="note" placeholder="Additional details">
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Add Transaction</button>
      </form>
      <div id="inventory-error" class="error-message"></div>
    </section>

    <section class="section">
      <h2 class="section-title">Inventory Transactions</h2>
      <div class="table-container">
        <table class="ledger-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Item</th>
              <th>Quantity</th>
              <th>Godown</th>
              <th>Person</th>
              <th>Action</th>
              <th>Note</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="inventory-body">
            <!-- Inventory transactions will be loaded here -->
          </tbody>
        </table>
      </div>
      <div id="inventory-empty" class="empty-row">No inventory transactions yet</div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
